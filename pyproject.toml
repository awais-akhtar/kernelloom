[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelloom"
version = "0.3.0"
description = "Run local AI models smoothly with a developer-friendly Python API and server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Awais Akhtar", email = "awais918@gmail.com" }
]
keywords = [
  "machine-learning",
  "inference",
  "openvino",
  "onnx",
  "gguf",
  "safetensors",
  "model-runtime",
  "hardware-acceleration"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]

[project.optional-dependencies]
llama = [
  "llama-cpp-python>=0.3.9"
]
openvino = [
  "numpy>=1.26,<3",
  "openvino>=2024.0"
]
genai = [
  "numpy>=1.26,<3",
  "openvino>=2024.0",
  "openvino-genai>=2024.0"
]
onnx = [
  "onnx>=1.16"
]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34"
]
langchain = [
  "langchain-core>=0.3.40"
]
all = [
  "fastapi>=0.115",
  "langchain-core>=0.3.40",
  "llama-cpp-python>=0.3.9",
  "numpy>=1.26,<3",
  "openvino>=2024.0",
  "openvino-genai>=2024.0",
  "uvicorn[standard]>=0.34"
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=6"
]

[project.scripts]
kernelloom = "kernelloom.cli:main"

[project.urls]
Homepage = "https://github.com/awais-akhtar/kernelloom"
Documentation = "https://github.com/awais-akhtar/kernelloom#readme"
Source = "https://github.com/awais-akhtar/kernelloom"
Issues = "https://github.com/awais-akhtar/kernelloom/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openagent_engine = ["py.typed"]
kernelloom = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
